<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartBistro Ordering System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>SmartBistro</h1>
    <p class="subtitle">Table 5 - QR Ordering Menu</p>

    <div class="menu-card">
      <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="Burger">
      <h2>Classic Beef Burger</h2>
      <p>Grilled beef patty, cheese, lettuce, tomato and special sauce.</p>
      <h3>$12.00</h3>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="cart">
      <h2>Order Summary</h2>
      <p id="cart-item">No item selected.</p>
      <p id="total"></p>
      <button onclick="checkout()">Pay Now</button>
    </div>

    <div id="confirmation" class="confirmation"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
